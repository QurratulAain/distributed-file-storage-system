<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distributed File Storage System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Distributed File Storage System</h1>
    <p class="subtitle">Frontend → Backend → Storage Service (three independent services)</p>
  </header>

  <main>
    <!-- Connection status: proves, live, that the frontend can reach the backend,
         and that the backend can in turn reach the storage service. -->
    <section id="status-box" class="card">
      <h2>System Status</h2>
      <p id="status-text">Checking connection…</p>
    </section>

    <!-- Upload form -->
    <section class="card">
      <h2>Upload a File</h2>
      <form id="upload-form">
        <input type="text" id="owner-input" placeholder="Your name (owner)" required />
        <input type="file" id="file-input" required />
        <button type="submit">Upload</button>
      </form>
      <p id="upload-message"></p>
    </section>

    <!-- File list -->
    <section class="card">
      <h2>Uploaded Files</h2>
      <button id="refresh-btn">Refresh List</button>
      <table id="files-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Owner</th>
            <th>Size</th>
            <th>Uploaded</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="files-tbody">
          <!-- populated by app.js -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
